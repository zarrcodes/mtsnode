<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Manager - MTs Mumarta</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="config.js"></script>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --primary: #0b3663;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --success: #16a34a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        
        .login-wrapper {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, var(--primary) 0%, #041426 100%);
        }
        .login-card {
            background: #fff; padding: 40px; border-radius: 16px; width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center;
        }
        .login-card h2 { color: var(--primary); margin-bottom: 24px; font-size: 20px; }
        .login-card input {
            width: 100%; padding: 14px; border: 1.5px solid var(--border);
            border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none;
        }
        .login-card button {
            width: 100%; padding: 14px; background: var(--primary); color: #fff;
            border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        .login-card button:hover { background: #06213e; }
        
        .app { display: none; max-width: 1400px; margin: 0 auto; padding: 24px; }
        .topbar {
            background: var(--card); padding: 16px 24px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; border: 1px solid var(--border);
        }
        .topbar h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .topbar .actions { display: flex; gap: 10px; }
        
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-icon { padding: 6px 8px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: var(--card); padding: 20px; border-radius: 12px;
            border: 1px solid var(--border); text-align: center;
        }
        .stat-card .icon { font-size: 28px; margin-bottom: 8px; color: var(--primary); }
        .stat-card .value { font-size: 28px; font-weight: 800; }
        .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
        
        .panel {
            background: var(--card); border-radius: 12px; border: 1px solid var(--border);
            padding: 24px; margin-bottom: 24px;
        }
        .panel-title {
            font-size: 16px; font-weight: 700; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .toolbar input, .toolbar select {
            padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 13px; outline: none;
        }
        .toolbar input { flex: 1; min-width: 200px; }
        .toolbar select { min-width: 180px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px; background: #f8fafc; font-weight: 700; font-size: 12px; color: var(--muted); border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
        th:hover { color: var(--primary); }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tr:hover td { background: #f8fafc; }
        
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
        .pagination button { padding: 8px 14px; border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        
        .sql-editor { width: 100%; min-height: 120px; padding: 14px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Courier New', monospace; font-size: 13px; resize: vertical; outline: none; }
        .sql-result { margin-top: 16px; max-height: 300px; overflow: auto; }
        .sql-result table { font-size: 12px; }
        .sql-result td { max-width: 200px; }
        
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15,23,42,0.8); z-index: 999; justify-content: center; align-items: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #fff; border-radius: 12px; padding: 28px; width: 600px; max-height: 80vh; overflow-y: auto;
        }
        .modal h3 { margin-bottom: 20px; font-size: 18px; }
        .modal .form-group { margin-bottom: 14px; }
        .modal label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
        .modal input, .modal textarea {
            width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 13px; outline: none;
        }
        .modal textarea { min-height: 80px; resize: vertical; }
        .modal .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        
        .toast {
            position: fixed; bottom: 24px; right: 24px; padding: 14px 20px;
            border-radius: 8px; color: #fff; font-weight: 600; font-size: 13px;
            z-index: 9999; display: none;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        
        .empty-state { text-align: center; padding: 40px; color: var(--muted); }
        .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-wrapper">
    <div class="login-card">
        <i class="fa-solid fa-database fa-3x" style="color: var(--primary); margin-bottom: 12px;"></i>
        <h2>Database Manager</h2>
        <p style="color: var(--muted); font-size: 13px; margin-bottom: 20px;">Masuk untuk mengelola database</p>
        <form id="formLogin">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPass" placeholder="Password" required>
            <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
        </form>
    </div>
</div>

<div id="app" class="app">
    <div class="topbar">
        <h1><i class="fa-solid fa-database"></i> Database Manager</h1>
        <div class="actions">
            <button class="btn btn-outline btn-sm" onclick="loadStats()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
            <button class="btn btn-primary btn-sm" onclick="exportDB()"><i class="fa-solid fa-download"></i> Export</button>
            <a href="admin.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-pen-to-square"></i> CMS</a>
            <button class="btn btn-danger btn-sm" onclick="logout()"><i class="fa-solid fa-power-off"></i> Keluar</button>
        </div>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="icon"><i class="fa-solid fa-table"></i></div><div class="value" id="statTables">-</div><div class="label">Tabel</div></div>
        <div class="stat-card"><div class="icon"><i class="fa-solid fa-list"></i></div><div class="value" id="statRows">-</div><div class="label">Total Baris</div></div>
        <div class="stat-card"><div class="icon"><i class="fa-solid fa-hard-drive"></i></div><div class="value" id="statSize">-</div><div class="label">Ukuran Database</div></div>
        <div class="stat-card"><div class="icon"><i class="fa-solid fa-file"></i></div><div class="value" id="statPath">-</div><div class="label">Lokasi File</div></div>
    </div>

    <div class="panel">
        <div class="panel-title">
            <span><i class="fa-solid fa-table-list"></i> Browser Tabel</span>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-primary btn-sm" onclick="openAddRow()"><i class="fa-solid fa-plus"></i> Tambah Baris</button>
            </div>
        </div>
        <div class="toolbar">
            <select id="tableSelect" onchange="changeTable()">
                <option value="">-- Pilih Tabel --</option>
            </select>
            <input type="text" id="tableSearch" placeholder="Cari..." onkeyup="searchTable()">
            <button class="btn btn-outline btn-sm" onclick="loadTable()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div style="overflow-x:auto" id="tableContainer">
            <div class="empty-state"><i class="fa-solid fa-arrow-up"></i>Pilih tabel untuk melihat data</div>
        </div>
        <div class="pagination" id="tablePagination"></div>
    </div>

    <div class="panel">
        <div class="panel-title">
            <span><i class="fa-solid fa-code"></i> SQL Editor</span>
            <span style="font-size:11px; color:var(--muted);">SELECT, INSERT, UPDATE, DELETE, PRAGMA</span>
        </div>
        <textarea id="sqlEditor" class="sql-editor" placeholder="SELECT * FROM berita ORDER BY created_at DESC LIMIT 10;"></textarea>
        <div style="margin-top:12px; display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="runQuery()"><i class="fa-solid fa-play"></i> Jalankan</button>
            <button class="btn btn-outline" onclick="document.getElementById('sqlEditor').value=''"><i class="fa-solid fa-eraser"></i> Bersihkan</button>
        </div>
        <div class="sql-result" id="sqlResult"></div>
    </div>
</div>

<div class="modal-overlay" id="modalRow">
    <div class="modal">
        <h3 id="modalTitle">Tambah Baris</h3>
        <div id="modalFields"></div>
        <div class="btn-row">
            <button class="btn btn-outline" onclick="closeModal()">Batal</button>
            <button class="btn btn-primary" id="btnSaveRow"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentTable = '';
let currentPage = 1;
let currentSort = '';
let currentSortDir = 'ASC';
let editingRowId = null;
let tableColumns = [];

function getToken() { return localStorage.getItem("dbManager_Token"); }

async function apiFetch(path, options = {}) {
    const token = getToken();
    const headers = { ...options.headers };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    if (!(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
    const res = await fetch(API_BASE + path, { ...options, headers });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Request gagal');
    return json;
}

function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("dbManager_Token")) showApp();
});

document.getElementById("formLogin").addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPass").value.trim();
    try {
        const json = await apiFetch('/api/login', { method: 'POST', body: JSON.stringify({ email, password }) });
        localStorage.setItem("dbManager_Token", json.token);
        showApp();
    } catch (err) {
        alert("Gagal login: " + err.message);
    }
});

function showApp() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadStats();
}

async function logout() {
    localStorage.removeItem("dbManager_Token");
    location.reload();
}

async function loadStats() {
    try {
        const data = await apiFetch('/api/db/stats');
        document.getElementById("statTables").textContent = data.totalTables;
        document.getElementById("statRows").textContent = data.tables.reduce((s, t) => s + t.rows, 0);
        const kb = (data.dbSize / 1024).toFixed(1);
        document.getElementById("statSize").textContent = kb < 1024 ? kb + ' KB' : (kb / 1024).toFixed(1) + ' MB';
        document.getElementById("statPath").textContent = data.dbPath.split('/').pop();

        const sel = document.getElementById("tableSelect");
        sel.innerHTML = '<option value="">-- Pilih Tabel --</option>';
        data.tables.forEach(t => {
            sel.innerHTML += `<option value="${t.name}">${t.name} (${t.rows} baris)</option>`;
        });
    } catch (err) {
        toast("Gagal memuat statistik: " + err.message, 'error');
    }
}

function changeTable() {
    currentTable = document.getElementById("tableSelect").value;
    currentPage = 1;
    if (currentTable) loadTable();
}

async function loadTable() {
    if (!currentTable) return;
    try {
        const search = document.getElementById("tableSearch").value;
        const params = new URLSearchParams({ page: currentPage, limit: 15, search, orderBy: currentSort, orderDir: currentSortDir });
        const data = await apiFetch(`/api/db/table/${currentTable}?${params}`);
        tableColumns = data.columns;
        renderTable(data);
        renderPagination(data);
    } catch (err) {
        document.getElementById("tableContainer").innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>${err.message}</div>`;
    }
}

function renderTable(data) {
    if (!data.rows || data.rows.length === 0) {
        document.getElementById("tableContainer").innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i>Tidak ada data</div>';
        return;
    }

    let html = '<table><thead><tr>';
    data.columns.forEach(col => {
        const dir = currentSort === col.name ? (currentSortDir === 'ASC' ? ' ▲' : ' ▼') : '';
        html += `<th onclick="sortTable('${col.name}')">${col.name}${dir}</th>`;
    });
    html += '<th style="width:100px;">Aksi</th></tr></thead><tbody>';

    data.rows.forEach((row, i) => {
        html += '<tr>';
        data.columns.forEach(col => {
            let val = row[col.name];
            if (val === null) val = '<span style="color:#94a3b8;">NULL</span>';
            else if (val === undefined) val = '';
            else val = String(val).substring(0, 100);
            html += `<td title="${String(row[col.name] || '').replace(/"/g,'&quot;')}">${val}</td>`;
        });
        html += `<td>
            <button class="btn btn-outline btn-sm btn-icon" onclick="openEditRow(${i})" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="deleteRow('${row.id}')" title="Hapus"><i class="fa-solid fa-trash"></i></button>
        </td></tr>`;
    });

    html += '</tbody></table>';
    document.getElementById("tableContainer").innerHTML = html;
}

function renderPagination(data) {
    const container = document.getElementById("tablePagination");
    if (data.totalPages <= 1) { container.innerHTML = ''; return; }

    let html = `<button ${data.page <= 1 ? 'disabled' : ''} onclick="goPage(${data.page - 1})">«</button>`;
    for (let i = 1; i <= data.totalPages; i++) {
        html += `<button class="${i === data.page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `<button ${data.page >= data.totalPages ? 'disabled' : ''} onclick="goPage(${data.page + 1})">»</button>`;
    container.innerHTML = html;
}

function goPage(p) { currentPage = p; loadTable(); }
function searchTable() { currentPage = 1; currentSort = ''; loadTable(); }

function sortTable(col) {
    if (currentSort === col) {
        currentSortDir = currentSortDir === 'ASC' ? 'DESC' : 'ASC';
    } else {
        currentSort = col;
        currentSortDir = 'ASC';
    }
    loadTable();
}

function openAddRow() {
    if (!currentTable) { toast("Pilih tabel dulu", 'error'); return; }
    editingRowId = null;
    document.getElementById("modalTitle").textContent = 'Tambah Baris - ' + currentTable;
    renderModalFields({});
    document.getElementById("modalRow").classList.add("show");
}

function openEditRow(index) {
    const rows = document.querySelectorAll("#tableContainer tbody tr");
    editingRowId = index;
    document.getElementById("modalTitle").textContent = 'Edit Baris - ' + currentTable;

    const rowEl = rows[index];
    const cells = rowEl.querySelectorAll("td");
    const rowData = {};
    tableColumns.forEach((col, i) => {
        rowData[col.name] = cells[i].getAttribute("title") || cells[i].textContent;
    });
    renderModalFields(rowData);
    document.getElementById("modalRow").classList.add("show");
}

function renderModalFields(data) {
    const container = document.getElementById("modalFields");
    let html = '';
    tableColumns.forEach(col => {
        if (col.name === 'id') return;
        const val = data[col.name] || '';
        const type = col.name === 'isi' ? 'textarea' : 'input';
        if (type === 'textarea') {
            html += `<div class="form-group"><label>${col.name} (${col.type})</label><textarea name="${col.name}">${val.replace(/"/g,'&quot;')}</textarea></div>`;
        } else {
            html += `<div class="form-group"><label>${col.name} (${col.type})</label><input type="text" name="${col.name}" value="${val.replace(/"/g,'&quot;')}"></div>`;
        }
    });
    container.innerHTML = html;

    document.getElementById("btnSaveRow").onclick = async function() {
        const formData = {};
        container.querySelectorAll("input, textarea").forEach(el => {
            if (el.value.trim()) formData[el.name] = el.value.trim();
        });

        try {
            if (editingRowId !== null) {
                const rows = document.querySelectorAll("#tableContainer tbody tr");
                const cells = rows[editingRowId].querySelectorAll("td");
                const rowId = tableColumns[0].name === 'id' ? (cells[0].getAttribute("title") || cells[0].textContent) : null;
                if (!rowId) { toast("Tidak bisa menemukan ID baris", 'error'); return; }
                await apiFetch(`/api/db/table/${currentTable}/${rowId}`, { method: 'PUT', body: JSON.stringify(formData) });
                toast("Baris berhasil diperbarui", 'success');
            } else {
                await apiFetch(`/api/db/table/${currentTable}`, { method: 'POST', body: JSON.stringify(formData) });
                toast("Baris berhasil ditambahkan", 'success');
            }
            closeModal();
            loadTable();
            loadStats();
        } catch (err) {
            toast("Gagal: " + err.message, 'error');
        }
    };
}

function closeModal() {
    document.getElementById("modalRow").classList.remove("show");
}

async function deleteRow(id) {
    if (!confirm("Yakin hapus baris ini?")) return;
    try {
        await apiFetch(`/api/db/table/${currentTable}/${id}`, { method: 'DELETE' });
        toast("Baris berhasil dihapus", 'success');
        loadTable();
        loadStats();
    } catch (err) {
        toast("Gagal hapus: " + err.message, 'error');
    }
}

async function runQuery() {
    const sql = document.getElementById("sqlEditor").value.trim();
    if (!sql) return;
    const resultDiv = document.getElementById("sqlResult");

    try {
        const data = await apiFetch('/api/db/query', { method: 'POST', body: JSON.stringify({ sql }) });

        if (data.type === 'select') {
            if (!data.rows || data.rows.length === 0) {
                resultDiv.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i>Query mengembalikan 0 hasil</div>';
                return;
            }
            let html = `<p style="margin-bottom:8px;color:var(--muted);">${data.rowCount} baris dikembalikan</p><table><thead><tr>`;
            data.columns.forEach(c => html += `<th>${c}</th>`);
            html += '</tr></thead><tbody>';
            data.rows.forEach(row => {
                html += '<tr>';
                data.columns.forEach(c => {
                    let val = row[c];
                    if (val === null) val = '<span style="color:#94a3b8;">NULL</span>';
                    html += `<td>${String(val || '').substring(0, 200)}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            resultDiv.innerHTML = html;
        } else {
            resultDiv.innerHTML = `<p style="color:var(--success);padding:12px;"><i class="fa-solid fa-circle-check"></i> ${data.message} (${data.changes} baris terpengaruh)</p>`;
        }
    } catch (err) {
        resultDiv.innerHTML = `<p style="color:var(--danger);padding:12px;"><i class="fa-solid fa-circle-xmark"></i> ${err.message}</p>`;
    }
}

async function exportDB() {
    try {
        const data = await apiFetch('/api/db/export');
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'mts_mumarta_export.json';
        a.click(); URL.revokeObjectURL(url);
        toast("Database berhasil diexport", 'success');
    } catch (err) {
        toast("Gagal export: " + err.message, 'error');
    }
}
</script>
</body>
</html>
